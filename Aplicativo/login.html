<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="phone">
      <div class="side-button left"></div>
      <div class="side-button right"></div>
      <div class="screen">
        <div class="status-bar">
          <span>9:41</span>
          <div class="notch"></div>
          <span>● ● ▰</span>
        </div>
        <main class="page-container">
          <div class="logo">✦</div>
          <header class="page-header">
            <h1>Bem-vindo!</h1>
            <p class="subtitle">Entre na sua conta para continuar.</p>
          </header>
          <form class="form" action="inicio_professor.html">
            <div class="input-group">
              <label>E-mail ou matrícula</label
              ><input
                type="text"
                placeholder="Digite seu e-mail ou matrícula"
                required
              />
            </div>
            <div class="input-group">
              <label>Senha</label
              ><input type="password" placeholder="Digite sua senha" required />
            </div>
            <div class="card-top">
              <label class="check-row"
                ><input type="checkbox" /> Lembrar de mim</label
              ><a class="text-link" href="recuperar_senha.html"
                >Esqueceu a senha?</a
              >
            </div>
            <button>Entrar</button>
          </form>
          <p class="text-link" style="margin-top: 25px; color: var(--muted)">
            Ainda não tem conta? <a href="cadastro_usuario.html">Cadastre-se</a>
          </p>
        </main>
        <div class="home-indicator"></div>
      </div>
    </div>
  </body>
</html>
